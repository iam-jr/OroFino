<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">OroFino Jewelry Logo</title>
  <desc id="logoDesc">A golden ring with a diamond and the letters OF inside.</desc>
  <defs>
    <linearGradient id="goldGradient" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fce6a3"/>
      <stop offset="45%" stop-color="#d7ab45"/>
      <stop offset="100%" stop-color="#a67b1f"/>
    </linearGradient>
    <linearGradient id="diamondGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ecf8ff"/>
      <stop offset="100%" stop-color="#b8ddff"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="32" fill="#0f1f3d"/>
  <circle cx="64" cy="74" r="30" fill="none" stroke="url(#goldGradient)" stroke-width="10"/>
  <polygon points="64,20 78,36 64,52 50,36" fill="url(#diamondGradient)" stroke="#7db7eb" stroke-width="2"/>
  <text x="64" y="80" text-anchor="middle" font-size="18" font-family="Georgia, serif" font-weight="700" fill="#fff3c8">OF</text>
</svg>
